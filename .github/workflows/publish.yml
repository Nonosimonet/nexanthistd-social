name: Publish to Instagram

on:
  # Plus de cron GitHub (26 nov. 2026) : il arrivait avec 1 a 9 h de retard et a
  # publie deux reels en pleine nuit. Le workflow est lance a la main chaque soir
  # vers 19h50 (Paris) par une tache planifiee sur le PC (gh workflow run).
  # La cadence (1 post tous les 2 jours) reste imposee par publish.mjs
  # (MIN_DAYS_BETWEEN_POSTS) : un lancement un soir « vide » ne publie rien.
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: instagram-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # v5 : les actions en v4 tournent encore sur Node 20, deprecie sur les runners.
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Publish next due post
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          MEDIA_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/main
          MIN_DAYS_BETWEEN_POSTS: "2"
        run: node scripts/publish.mjs

      - name: Commit queue changes
        run: |
          git config user.name "nexanthis-bot"
          git config user.email "actions@github.com"
          git add posts/
          git diff --cached --quiet || git commit -m "chore: move published post out of queue"
          git push
