name: Instagram - post auto NexanthisTD

# Publie 1 post Instagram via l'API officielle Meta.
on:
  # === PLANIFICATION AUTOMATIQUE DESACTIVEE pendant la beta du jeu ===
  # POUR PASSER EN PRODUCTION le jour du lancement : decommente le bloc schedule ci-dessous.
  # schedule:
  #   - cron: "0 16 * * *"   # 18h Paris (16h UTC, heure d'ete)
  #
  # En attendant, seul le declenchement MANUEL est possible (bouton "Run workflow").
  workflow_dispatch:
    inputs:
      post_id:
        description: "Forcer un post precis (son 'id' dans content.json). Vide = rotation du jour."
        required: false
        default: ""
      dry_run:
        description: "1 = test a blanc (ne publie rien)"
        required: false
        default: "0"

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publier le post
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MEDIA_BRANCH: ${{ github.ref_name }}
          POST_ID: ${{ github.event.inputs.post_id }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python social/instagram/post.py
